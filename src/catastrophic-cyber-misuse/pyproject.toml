[project]
name = "harbor-catastrophic-cyber-misuse-adapter"
version = "0.1.0"
description = "Harbor adapter for the Catastrophic Cyber Capabilities Benchmark (3CB)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
catastrophic-cyber-misuse = "catastrophic_cyber_misuse.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "catastrophic_cyber_misuse"
