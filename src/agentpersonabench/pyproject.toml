[project]
name = "harbor-agentpersonabench-adapter"
version = "0.1.0"
description = "Harbor adapter for AgentPersonaBench survey, chat, web, and os-app"
readme = "README.md"
authors = [
    { name = "Jaden Hou", email = "36116720+JianhengHou@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "pyyaml",
]

[project.scripts]
agentpersonabench = "agentpersonabench.main:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentpersonabench"
