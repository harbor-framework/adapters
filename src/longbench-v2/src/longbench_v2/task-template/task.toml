authors = [
    { name = "Yushi Bai" },
    { name = "Shangqing Tu" },
    { name = "Jiajie Zhang" },
    { name = "Hao Peng" },
    { name = "Xiaozhi Wang" },
    { name = "Xin Lv" },
    { name = "Shulin Cao" },
    { name = "Jiazheng Xu" },
    { name = "Lei Hou" },
    { name = "Yuxiao Dong" },
    { name = "Jie Tang" },
