# JAXBench — parity subset with mini-swe-agent + DeepSeek V4.1 Flash (GKE, TPU v6e 1x1)
#
# 15 tasks from `--split parity` (7 priority kernels incl. the 3 Pallas-oracle tasks, plus every
# 4th KernelBench workload from 18k). The original-side runner must use the same agent version,
# model, and OpenHands settings.
#
# Generate the dataset first (from src/jaxbench):
#   uv run jaxbench --split parity --output-dir ../../datasets/jaxbench-parity
#
# Usage (from the repository root; LLM_API_KEY must be exported, e.g. from a private env file):
#   uvx --from 'harbor[gke]==0.23.0' harbor jobs start -c src/jaxbench/run_jaxbench_gke_tpu_v6e_parity_mini.yaml
#
# See run_jaxbench_gke_tpu_v6e.yaml for GKE prerequisites.

jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
# One v6e chip: extra concurrent trials would only wait Pending for the TPU.
n_concurrent_trials: 1
quiet: false

datasets:
  - path: datasets/jaxbench-parity

agents:
  - name: mini-swe-agent
    model_name: openai/deepseek-v4.1-flash
    kwargs:
      version: "2.4.6"
      # Native mini-swe-agent config layered over its builtin `mini` config.
      # DeepSeek V4.1 Flash recommended sampling (tech report, arXiv 2609.19969, Sec. 5.3.1);
      # step limit matches the OpenHands config's max_iterations.
      config:
        agent:
          step_limit: 150
        model:
          model_kwargs:
            temperature: 1.0
            top_p: 0.95
      # Note: do not set reasoning_effort; with an openai/ model Harbor routes it through the
      # Responses API, which the gateway does not implement for this model.
    env:
      # Harbor checks MSWEA_API_KEY before launch, but mini-swe-agent's LiteLLM model passes no
      # key itself; LiteLLM reads OPENAI_API_KEY for `openai/` models, so set both.
      MSWEA_API_KEY: ${LLM_API_KEY}
      OPENAI_API_KEY: ${LLM_API_KEY}
      OPENAI_BASE_URL: https://app-us.ppapi.ai/v1
      # LiteLLM has no price entry for this model; keep cost tracking from aborting the run.
      MSWEA_COST_TRACKING: ignore_errors

environment:
  type: gke
  force_build: false
  delete: true
  # Applied to every command in the trial container, including the agent install.
  # Harbor installs mini-swe-agent with an unpinned `--with litellm`; litellm 1.106.0
  # (2026-10-18) imports the optional `mcp` package on its tool-calling path, so every
  # model call fails. Resolving packages as of this date gives litellm 1.105.1 and also
  # pins the agent toolchain for reproducibility (use the same value on the original side).
  env:
    UV_EXCLUDE_NEWER: "2026-10-17T00:00:00Z"
  kwargs:
    project_id: tpu-test-448023
    cluster_name: lehui-tpu-us-central1
    region: us-central1
    namespace: default
    registry_location: us-central1
    registry_name: harbor-jaxbench

# JAXBench paper aggregates (arXiv:2607.20466, Table 2): mean of per-task `reward`
# (built-in) plus the geometric mean of floored speedups.
metrics:
  - type: mean
  - type: uv-script
    kwargs:
      script_path: src/jaxbench/metrics/geomean.py
