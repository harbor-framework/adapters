# Generate local tasks first; export VLM_API_KEY, VLM_API_BASE_URL, and VLM_MODEL.
job_name: webgen-bench-oracle
jobs_dir: jobs
n_attempts: 1

orchestrator:
  type: local
  n_concurrent_trials: 1

environment:
  type: docker
  delete: true

agents:
  - name: oracle

# To evaluate a generation agent instead:
# agents:
#   - name: aider
#     model_name: openai/gpt-5-mini

datasets:
  - path: datasets/webgen-bench
