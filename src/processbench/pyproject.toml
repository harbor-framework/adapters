[project]
name = "harbor-processbench-adapter"
version = "0.1.0"
description = "Harbor adapter for ProcessBench (identifying the earliest process error in math solutions)"
readme = "README.md"
authors = [
    { name = "Jinyi Bai", email = "baijinyi@ruc.edu.cn" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
processbench = "processbench.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "processbench"
