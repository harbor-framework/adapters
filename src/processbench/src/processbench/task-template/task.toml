schema_version = "1.0"

[task]
name = "qwen/processbench__{task_id}"
authors = [
    { name = "Chujie Zheng" },
    { name = "Zhenru Zhang" },
    { name = "Beichen Zhang" },
    { name = "Runji Lin" },
    { name = "Keming Lu" },
    { name = "Bowen Yu" },
    { name = "Dayiheng Liu" },
    { name = "Jingren Zhou" },
    { name = "Junyang Lin" },
]
keywords = ["math", "process-error-detection", "{subset}"]

[metadata]
difficulty = "hard"
category = "reasoning"
subset = "{subset}"
has_error = {has_error}
generator = "{generator}"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
