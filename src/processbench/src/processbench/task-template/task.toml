schema_version = "1.0"

# The agent's answer is the only thing handed to the separate verifier.
artifacts = ["/app/answer.txt"]

[task]
name = "qwen/processbench__{task_id}"
authors = [
    { name = "Chujie Zheng" },
    { name = "Zhenru Zhang" },
    { name = "Beichen Zhang" },
    { name = "Runji Lin" },
    { name = "Keming Lu" },
    { name = "Bowen Yu" },
    { name = "Dayiheng Liu" },
    { name = "Jingren Zhou" },
    { name = "Junyang Lin" },
]
keywords = ["math", "process-error-detection", "{subset}"]

[metadata]
difficulty = "hard"
category = "reasoning"
subset = "{subset}"
has_error = {has_error}
generator = "{generator}"

# Grading runs in its own container built from tests/Dockerfile, so the agent
# never sees the label in tests/ground_truth.json and cannot touch the grader.
[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
network_mode = "no-network"

# Upstream ProcessBench is offline generation with no tools or network. Only
# LLM APIs are reachable while the agent runs (agent setup keeps the public
# baseline so installed agents can install). Add a relay/proxy endpoint with
# `harbor run --allow-agent-host <host>`.
[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
