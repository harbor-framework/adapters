# Parity subset (200 tasks): generate first with
#   cd src/processbench && uv run processbench --split parity --output-dir ../../datasets/processbench_parity
# Run from the repository root with the keys in a .env file:
#   harbor run -c src/processbench/run_processbench_parity.yaml --env-file <file> --allow-agent-host <provider host>
# Then compute per-subset metrics for each job with processbench.aggregate_metrics.
#
# Settings of the reported parity experiment: codex@0.161.0, gpt-5.6-terra, Daytona, 3 runs per side.
# `config` is your own codex config.toml (provider, base URL, reasoning_effort = "xhigh"); it is not
# part of this repository because it holds provider settings.
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 32
quiet: false
retry:
  max_retries: 2  # infrastructure errors only; Harbor does not retry timeouts, usage limits or refusals
environment:
  type: daytona  # use `type: docker` to run locally (lower n_concurrent_trials to about 8)
  force_build: false
  delete: true
agents:
  - name: codex
    model_name: openai/gpt-5.6-terra
    kwargs:
      version: "0.161.0"
      config: /path/to/config.toml
  # Oracle (reference answers):
  # - name: oracle
datasets:
  - path: datasets/processbench_parity
