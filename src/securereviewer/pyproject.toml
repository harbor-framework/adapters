[project]
name = "harbor-securereviewer-adapter"
version = "0.1.0"
description = "Harbor adapter for SecureReviewer (ICSE 2026): security-focused code review comment generation scored with SecureBLEU"
readme = "README.md"
authors = [
    { name = "Yi Lu", email = "81632945+YiDanielLu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
securereviewer = "securereviewer.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "securereviewer"
