[project]
name = "harbor-control-arena-bash-honest-adapter"
version = "0.1.0"
description = "Generate Harbor tasks for ControlArena's honest Bash text-processing cases"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["control-arena==20.1.1", "filelock>=3.29.4", "harbor==0.27.0"]

[project.scripts]
control-arena-bash-honest = "control_arena_bash_honest.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "control_arena_bash_honest"
