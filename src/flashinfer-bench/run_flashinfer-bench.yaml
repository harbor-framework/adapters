#     model_name: gpt-5-2025-08-07
#     kwargs:
#       language: triton
#       rounds: 10
#       attempts: 2
#       reasoning_effort: high
#       seed: 0
# CLI agents use the packaging instruction, so are a separate protocol comparison.
environment:
  type: docker
  delete: true
orchestrator:
  type: local
  n_concurrent_trials: 1
