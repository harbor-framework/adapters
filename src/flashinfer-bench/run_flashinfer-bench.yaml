datasets:
  - path: ../../datasets/flashinfer-bench
# Run from this adapter directory. Harbor's default mean imputes missing scores
# as zero; upstream instead averages scorable definitions and reports coverage.
metrics:
  - type: uv-script
    kwargs:
      script_path: src/flashinfer_bench/aggregate.py
agents:
  - name: oracle
# Native protocol (after agreeing the parity plan and exact model):
# agents:
