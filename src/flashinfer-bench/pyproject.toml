[project]
name = "harbor-flashinfer-bench-adapter"
version = "0.1.0"
description = "Harbor packaging for the pinned FlashInfer-Bench evaluator and native generator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "vyomakesh0728", email = "dvyomkesh.vishwakarma@gmail.com" }]
dependencies = []

[project.scripts]
flashinfer-bench = "flashinfer_bench.main:main"

[project.optional-dependencies]
harbor = ["harbor==0.25.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flashinfer_bench"]
