schema_version = "1.4"
# Only the submitted answer crosses into the fresh verifier container.
artifacts = ["/app/answer.txt"]

[task]
name = "epoch-ai/chess-puzzles____TASK_ID__"
authors = [{ name = "Epoch AI" }]
keywords = ["chess", "puzzles", "reasoning", "single-move"]

[metadata]
difficulty = "hard"
category = "reasoning"
sample_id = __SAMPLE_ID__
upstream_version = "2.0.1"

[verifier]
environment_mode = "separate"
timeout_sec = 30.0

[verifier.environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
