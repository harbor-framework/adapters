schema_version = "1.0"
artifacts = [
    { source = "/var/lib/balrog/result.json", service = "game" },
]
[task]
name = "balrog/__TASK_ID__"
authors = [
    { name = "Davide Paglieri" },
    { name = "Bartłomiej Cupiał" },
    { name = "BALROG contributors" },
]
[metadata]
category = "games"
difficulty = "easy"
tags = ["balrog", "babyai", "interactive", "text-only"]
[agent]
timeout_sec = 300.0
user = "agent"
[verifier]
timeout_sec = 120.0
environment_mode = "separate"
user = "root"
[[verifier.collect]]
service = "game"
command = "python -I /app/export_result.py --request-timeout 100"
user = 1000
timeout_sec = 120.0
[verifier.environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
[environment.healthcheck]
command = "chown root:root /logs/verifier && chmod 700 /logs/verifier && su -s /bin/sh agent -c 'test ! -w /logs/verifier'"
interval_sec = 1.0
timeout_sec = 10.0
retries = 1
