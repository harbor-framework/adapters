[project]
name = "harbor-sregym-adapter"
version = "0.1.0"
description = "Harbor adapter for SREGym, a live benchmark of SRE agents on Kubernetes incidents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sregym = "sregym.main:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sregym"
