[project]
name = "harbor-redcode-exec-adapter"
version = "0.1.0"
description = "Strict-parity Harbor adapter for RedCode-Exec."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
harbor = ["harbor==0.23.0"]

[project.scripts]
redcode-exec = "redcode_exec.main:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "redcode_exec"
module-root = "src"
