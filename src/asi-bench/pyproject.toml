[project]
name = "harbor-asi-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for ASI-Bench seed31415"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
asi-bench = "asi_bench.main:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asi_bench"]
