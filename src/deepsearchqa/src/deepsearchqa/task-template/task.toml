schema_version = "1.0"

[task]
name = "google/deepsearchqa__{task_id}"
authors = [
    { name = "Nikita Gupta" },
    { name = "Riju Chatterjee" },
    { name = "Lukas Haas" },
    { name = "Connie Tao" },
    { name = "Andrew Wang" },
    { name = "Chang Liu" },
    { name = "Hidekazu Oiwa" },
    { name = "Elena Gribovskaya" },
    { name = "Jan Ackermann" },
    { name = "John Blitzer" },
    { name = "Sasha Goldshtein" },
    { name = "Dipanjan Das" },
]
keywords = ["deepsearchqa"]

[metadata]
difficulty = "hard"
category = "deep-research"

[agent]
# Deep research tasks need many search/browse steps.
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0

[verifier.env]
# Official autorater is Gemini 2.5 Flash. Set JUDGE_MODEL to an OpenAI model
# (e.g. "gpt-5-mini") to use OPENAI_API_KEY instead; see README.
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
JUDGE_MODEL = "${DSQA_JUDGE_MODEL:-gemini-2.5-flash}"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
