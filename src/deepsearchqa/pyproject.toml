[project]
name = "harbor-deepsearchqa-adapter"
version = "0.1.0"
description = "Harbor adapter for DeepSearchQA (Google DeepMind)"
readme = "README.md"
authors = [
    { name = "Erin Wang", email = "erinwang27y@gmail.com" }
]
requires-python = ">=3.11"
# Standard library only: the CSV is fetched with urllib and parsed with csv.
dependencies = []

[project.scripts]
deepsearchqa = "deepsearchqa.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepsearchqa"
