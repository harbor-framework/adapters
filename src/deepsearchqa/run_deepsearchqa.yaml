jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false
environment:
  type: docker
  force_build: true
  delete: true
  # The judge reads GEMINI_API_KEY (default autorater: gemini-2.5-flash).
  # Not needed for the oracle run.
agents:
  - name: oracle
  # Uncomment to run an agent (pin versions for parity):
  # - name: claude-code
  #   model_name: anthropic/claude-sonnet-4-5-20250929
  # - name: codex
  #   model_name: openai/gpt-5-mini
datasets:
  - path: datasets/deepsearchqa
