[project]
name = "harbor-swe-rpg-adapter"
version = "0.1.0"
description = "Harbor adapter for SWE-RPG"
readme = "README.md"
authors = [
    { name = "Jianghao Zhang", email = "jianghz@umich.edu" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
swe-rpg = "swe_rpg.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "swe_rpg"
