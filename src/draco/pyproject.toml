[project]
name = "harbor-draco-adapter"
version = "0.1.0"
description = "Harbor adapter for DRACO (Perplexity deep research benchmark with expert rubrics)"
readme = "README.md"
authors = [
    { name = "Jianing Yin", email = "jianingyin@alumni.upenn.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface_hub>=0.30",
]

[project.scripts]
draco = "draco.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "draco"
