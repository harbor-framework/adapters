[project]
name = "harbor-control-arena-shade-accounting-honest-adapter"
version = "0.1.0"
description = "Generate the isolated SHADE expenditure accounting main task"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["filelock>=3.29.4", "harbor==0.27.0", "pyyaml>=6,<7"]

[project.scripts]
control-arena-shade-accounting-honest = "control_arena_shade_accounting_honest.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "control_arena_shade_accounting_honest"
