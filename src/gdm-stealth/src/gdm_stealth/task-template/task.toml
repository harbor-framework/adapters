schema_version = "1.0"

[task]
name = "google-deepmind/gdm-stealth__{task_id}"
authors = [
    { name = "Mary Phuong" },
    { name = "Roland S. Zimmermann" },
    { name = "Ziyue Wang" },
    { name = "David Lindner" },
    { name = "Victoria Krakovna" },
    { name = "Sarah Cogan" },
    { name = "Allan Dafoe" },
    { name = "Lewis Ho" },
    { name = "Rohin Shah" },
]
keywords = ["safety", "stealth", "gdm"]

[metadata]
difficulty = "{difficulty}"
category = "safety"
tags = {tags}

[verifier]
network_mode = "no-network"
user = "root"
timeout_sec = 120.0

[agent]
network_mode = "no-network"
user = "agent"
timeout_sec = 3600.0

[solution]
timeout_sec = 1800.0

[solution.env]
GDM_RATER_BASE_URL = "${GDM_RATER_BASE_URL:-https://openrouter.ai/api/v1}"
GDM_RATER_API_KEY = "${GDM_RATER_API_KEY:-}"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
