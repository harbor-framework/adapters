[project]
name = "harbor-gdm-stealth-adapter"
version = "0.1.0"
description = "Harbor adapter for the GDM stealth evaluations from arXiv:2505.01420"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gdm-stealth = "gdm_stealth.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gdm_stealth"
