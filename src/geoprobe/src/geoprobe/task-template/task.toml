version = "1.0"
artifacts = ["/workspace/answer.json"]

[task]
name = "embodied-agent-arena/geoprobe-${task_id}"
authors = [${authors}]

[metadata]
category = "visual-reasoning"
tags = ["geoprobe", "geometry", "${protocol}"]
upstream_sample_id = "${sample_id}"

[agent]
timeout_sec = 960.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
