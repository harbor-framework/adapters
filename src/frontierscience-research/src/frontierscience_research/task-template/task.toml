schema_version = "1.0"

[task]
name = "openai/frontierscience-research__{task_id}"
authors = [
    { name = "Miles Wang", email = "milesw@openai.com" },
]
keywords = ["frontierscience", "research", "{subject}", "rubric", "llm-judge"]

[metadata]
difficulty = "hard"
category = "science"
subject = "{subject}"
task_group_id = "{task_group_id}"
source_row_index = {row_index}

[verifier]
# One judge call with extended thinking; the SDK retries transient API errors.
timeout_sec = 900.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
JUDGE_MODEL = "${JUDGE_MODEL:-claude-sonnet-5-5}"
JUDGE_EFFORT = "${JUDGE_EFFORT:-high}"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
