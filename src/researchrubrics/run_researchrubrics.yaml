jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  force_build: true
  delete: true
  # env:
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
# The verifier calls an LLM judge. Export the key for the judge provider
# (GEMINI_API_KEY for the default gemini/gemini-2.5-pro) and optionally
# JUDGE_MODEL / JUDGE_API_BASE / JUDGE_API_KEY before running.
agents:
  - name: oracle
  # - name: claude-code
  #   model_name: anthropic/claude-haiku-4-5-20251001
  # - name: codex
  #   model_name: openai/gpt-5-mini
datasets:
  - path: datasets/researchrubrics
artifacts:
  - /app/report.md
