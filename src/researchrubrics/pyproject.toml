[project]
name = "harbor-researchrubrics-adapter"
version = "0.1.0"
description = "Harbor adapter for ResearchRubrics (Scale AI deep research rubric benchmark)"
readme = "README.md"
authors = [
    { name = "Jianing Yin", email = "jianingyin@alumni.upenn.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface_hub>=0.30",
]

[project.scripts]
researchrubrics = "researchrubrics.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "researchrubrics"
