[project]
name = "harbor-caibench-adapter"
version = "0.1.0"
description = "Harbor adapter for CAIBench"
readme = "README.md"
authors = [
    { name = "Tristan", email = "troath@berkeley.edu" },
    { name = "Tyler", email = "tyroath@berkeley.edu" },
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
caibench = "caibench.main:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "caibench"
