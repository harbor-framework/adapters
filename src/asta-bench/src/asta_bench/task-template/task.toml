# Refer to https://harborframework.com/docs/task-format for more details.

schema_version = "1.0"

# Skeleton only: each family builder under `asta_bench.benchmarks` emits the
# real task.toml (including per-family timeouts); nothing here ships.
[task]
# Task name format: "<org>/<benchmark>__<task_id>".
name = "allenai/asta-bench__{task_id}"

authors = [
    { name = "Allen Institute for AI (AstaBench)", email = "asta@allenai.org" },
]

keywords = ["scientific-agent", "inspect-ai"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
