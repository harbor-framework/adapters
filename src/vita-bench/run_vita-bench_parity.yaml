# Harbor job config for the VitaBench parity subset (20 of 400 tasks, `--split parity`).
#
# Run from the adapters repository root:
#   uv run --project src/vita-bench vita-bench --split parity --output-dir datasets/vita-bench-parity
#   PYTHONPATH="$PWD/src/vita-bench" uv run --project src/vita-bench harbor run -c src/vita-bench/run_vita-bench_parity.yaml
#
# Required environment variables:
#   OPENAI_API_KEY / OPENAI_BASE_URL   OpenAI-compatible endpoint used by the agent,
#                                      the user simulator and the evaluator (same as
#                                      the upstream models.yaml base_url).
#   VITA_USER_MODEL=deepseek-v4.1-flash      user-simulator model (same as the agent model)
#   VITA_EVALUATOR_MODEL=claude-haiku-5-5    evaluator model
#
# Upstream `vita run --num-trials 3` derives one seed per trial; Harbor expresses
# that as three agent entries with vita_trial_index 0/1/2 and n_attempts 1.
jobs_dir: jobs/vita-bench-parity
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false
retry:
  max_retries: 3
environment:
  type: docker
  force_build: false
  delete: true
agents:
  - name: vita_llm_agent
    import_path: vita_llm_agent:VitaLLMAgent
    model_name: openai/deepseek-v4.1-flash
    kwargs:
      vita_trial_index: 0
  - name: vita_llm_agent
    import_path: vita_llm_agent:VitaLLMAgent
    model_name: openai/deepseek-v4.1-flash
    kwargs:
      vita_trial_index: 1
  - name: vita_llm_agent
    import_path: vita_llm_agent:VitaLLMAgent
    model_name: openai/deepseek-v4.1-flash
    kwargs:
      vita_trial_index: 2
datasets:
  - path: datasets/vita-bench-parity
