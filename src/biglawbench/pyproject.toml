[project]
name = "harbor-biglawbench-adapter"
version = "0.1.0"
description = "Harbor adapter for BigLaw Bench (Harvey)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
biglawbench = "biglawbench.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "biglawbench"
