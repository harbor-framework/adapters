[project]
name = "harbor-rsi-exam-adapter"
version = "0.1.0"
description = "Harbor adapter for RSI-Exam: benchmarking recursive self-improvement through executable research"
readme = "README.md"
authors = [
    { name = "Jack Wang", email = "faldict@ucsc.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.34",
]

[project.scripts]
rsi-exam = "rsi_exam.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rsi_exam"
