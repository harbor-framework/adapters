# Structural reference only. RSI-Exam tasks are authored natively in Harbor format,
# so the adapter copies each upstream task.toml verbatim and rewrites only
# [task].name to "rsi-exam/{task_id}". Every other field (timeouts, network policy,
# separate verifier environment, resources, artifacts, scoring) is upstream's.
schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "rsi-exam/{task_id}"
description = "Upstream task description (copied verbatim)."
# Upstream task authors (copied verbatim from each task.toml).
authors = [{ name = "RSI-Exam Team" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
network_mode = "public"

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
