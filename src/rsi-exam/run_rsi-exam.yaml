# Reference job config for RSI-Exam. Run from the adapters repo root:
#   harbor run -c src/rsi-exam/run_rsi-exam.yaml
#
# Default: oracle agent (environment build + sealed-grader smoke test; see README —
# 11 tasks install the upstream reference, 24 keep the shipped baseline).
#
# For real agents, RSI-Exam applies its autoresearch protocol at run time, exactly
# as upstream does (github.com/aiming-lab/RSI-Exam, "Quick Start"):
#   export ARB_PROGRAM=$PWD/src/rsi-exam/src/rsi_exam/protocol/autoresearch.md
#   export ARB_BUDGET_PY=$PWD/src/rsi-exam/src/rsi_exam/protocol/budget.py
#   export ARB_AGENT_TIMEOUT_SEC=43200      # 12h, matches [agent] timeout_sec
#   export ARB_OUTPUT_TOKEN_LIMIT=500000
# then uncomment ONE agent block below together with the
# `extra_docker_compose` entry under `environment`.
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  delete: true
  # Required for non-oracle agents (mounts /app/AUTORESEARCH.md, /app/TASK.md, /app/budget.py):
  # extra_docker_compose:
  #   - src/rsi-exam/src/rsi_exam/protocol/mount.yaml
agents:
  - name: oracle

