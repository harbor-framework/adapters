[project]
name = "harbor-gitgoodbench-adapter"
version = "0.1.0"
description = "Harbor adapter for the merge-resolution split of GitGoodBench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
]

[project.scripts]
gitgoodbench = "gitgoodbench.main:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gitgoodbench"
module-root = "src"
