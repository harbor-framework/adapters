schema_version = "1.0"

[task]
name = "meridianlabs-ai/petri__{task_id}"
authors = [
    { name = "Kai Fronsdal" },
    { name = "Isha Gupta" },
    { name = "Abhay Sheshadri" },
    { name = "Jonathan Michala" },
    { name = "Stephen McAleer" },
    { name = "Rowan Wang" },
    { name = "Sara Price" },
    { name = "Samuel R. Bowman" },
]
keywords = ["petri"]

[metadata]
difficulty = "hard"
category = "alignment-auditing"

[verifier]
timeout_sec = 600.0

[verifier.env]
# Authenticates the verifier against the auditor sidecar's /transcript endpoint (see environment/auditor_server.py).
RESULT_TOKEN = "{result_token}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
JUDGE_MODEL = "{judge_model}"

[agent]
timeout_sec = {agent_timeout_sec}

[environment]
build_timeout_sec = 600.0
