[project]
name = "harbor-androidworld-adapter"
version = "0.1.0"
description = "Harbor adapter for AndroidWorld (google-research/android_world)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
agent = ["harbor>=0.26.0"]

[project.scripts]
androidworld = "androidworld.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "androidworld"
