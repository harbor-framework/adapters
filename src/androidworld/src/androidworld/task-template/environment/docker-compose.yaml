services:
  main:
    devices:
      - /dev/kvm
    environment:
      ANDROIDWORLD_ALLOW_TCG: "${ANDROIDWORLD_ALLOW_TCG:-0}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    stop_grace_period: 1m
