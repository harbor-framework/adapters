[project]
name = "harbor-gdm-situational-awareness-adapter"
version = "0.1.0"
description = "Harbor adapter for the GDM self-reasoning (situational awareness) evaluations from arXiv:2505.01420"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gdm-situational-awareness = "gdm_situational_awareness.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gdm_situational_awareness"
