# Default oracle run (verified 22/22 reward 1.0, 2026-11-15).
# Parity runs must use the custom GDM parity agent, not a CLI
# agent; see README Adapter Features for the import path.
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  force_build: true
  delete: true
  # env:
  #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #   ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
agents:
  - name: oracle
  # - name: claude-code
  #   model_name: anthropic/claude-haiku-4-5-20251001
datasets:
  - path: datasets/gdm-situational-awareness