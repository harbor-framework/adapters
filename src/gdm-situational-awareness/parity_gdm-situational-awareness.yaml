# Planned parity configuration. Replace provider/model with the exact
# dated model ID agreed with the Harbor team; after `uv sync` in this
# adapter directory, run from the repository root:
#   PYTHONPATH=src/gdm-situational-awareness/src harbor run -c src/gdm-situational-awareness/parity_gdm-situational-awareness.yaml
# n_attempts=10 mirrors Inspect's default epochs for one parity run;
# aggregate externally as per-trial success and solved-if->=1-of-N.
jobs_dir: jobs
n_attempts: 10
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  force_build: true
  delete: true
agents:
  - name:
    import_path: gdm_situational_awareness.custom_agent.agent:GDMSelfReasoningParityAgent
    model_name: provider/model
datasets:
  - path: datasets/gdm-situational-awareness
