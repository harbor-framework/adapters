[project]
name = "harbor-cava-adapter"
version = "0.1.0"
description = "Harbor adapter for CAVA (Comprehensive Assessment of Voice Assistants), pipeline/transcript variant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "openai==2.54.0",
]

[project.optional-dependencies]
# only needed to rebuild the manifests (prepare/prepare_manifests.py)
prepare = ["datasets", "librosa", "soundfile", "numpy>=2"]  # pyarrow needs numpy 2 at runtime
# only needed to check the oracle answers offline (prepare/validate_oracles.py)
score = [
    "qa-metrics==0.2.32",
    "nltk==3.9.1",
    "scikit-learn==1.3.2",
    "numpy<2.0",
    "scipy",
    "instruction_following_eval @ git+https://github.com/josejg/instruction_following_eval.git@0c495b2f95155e8b10acb919ae283bfb4d5be6e2",
]

[project.scripts]
cava = "cava.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cava"

[tool.uv]
# resolved separately: the scorer pins numpy<2, while current pyarrow (datasets) needs numpy 2
conflicts = [[{ extra = "prepare" }, { extra = "score" }]]
