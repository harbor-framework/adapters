schema_version = "1.3"
source = "CAVA"

# Agent outputs handed to the separate verifier sandbox.
artifacts = ["/app/answer.txt", "/app/function_calls.jsonl"]

[task]
name = "cava/{{TASK_ID}}"
description = "CAVA {{SUBTASK}} (pipeline/transcript variant), item {{ITEM_ID}}"
authors = [
    { name = "Will Held" },
    { name = "Michael J. Ryan" },
    { name = "Diyi Yang" },
]
keywords = ["cava", "voice-assistant", "audio", "{{SUBTASK}}"]

[metadata]
subtask = "{{SUBTASK}}"
item_id = "{{ITEM_ID}}"
metric = "{{METRIC}}"
category = "voice-assistant"
difficulty = "medium"

[agent]
timeout_sec = 600.0
# Agent phase: LLM API hosts only, so reference answers cannot be looked up online
# (the public datasets carry them). Agent installation still runs on the public
# baseline network; add a provider with `harbor run --allow-agent-host <host>`.
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

# tests/Dockerfile bakes the scorer dependencies (IFEval pinned commit, qa-metrics
# PEDANT models pinned, nltk data), so grading needs no network.
[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 4096

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/app"
