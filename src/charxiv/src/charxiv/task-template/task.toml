version = "1.0"
# The verifier runs in a separate container and only receives this file.
artifacts = [{ source = "/app/answer.txt" }]

[task]
name = "{{task_name}}"
authors = [
{{authors}}
]

[metadata]
difficulty = "medium"
category = "{{category}}"
tags = [{{tags}}]
source = "princeton-nlp/CharXiv (validation split)"

[agent]
timeout_sec = 900.0
# Upstream CharXiv queries each model once with the chart and question, with no
# tools and no internet access, and the validation answers are public. The
# agent therefore runs with no network by default. Allow only the model API
# host at run time, e.g. `harbor run ... --allow-agent-host api.anthropic.com`.
# (Agent installation and the separate verifier keep normal network access.)
network_mode = "no-network"

[verifier]
environment_mode = "separate"
timeout_sec = 600.0

[verifier.env]
# LLM judge (upstream CharXiv grades with GPT-4o). Only used when the answer
# is not an exact match of the ground truth (see tests/judge.py).
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
JUDGE_MODEL = "${CHARXIV_JUDGE_MODEL:-gpt-4o-2024-08-06}"
CHARXIV_EXACT_MATCH_SHORTCUT = "${CHARXIV_EXACT_MATCH_SHORTCUT:-1}"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/app"
