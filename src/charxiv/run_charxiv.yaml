# Reference config for CharXiv (validation split, 5000 tasks).
# Oracle is the default agent; it passes deterministically without any API key
# because the verifier short-circuits exact matches to reward 1.
# Generate tasks first:  cd src/charxiv && uv run charxiv --output-dir ../../datasets/charxiv
job_name: charxiv
jobs_dir: jobs/charxiv
n_attempts: 1
timeout_multiplier: 1.0

datasets:
  - path: datasets/charxiv

agents:
  - name: oracle

# Agents must be able to view images (claude-code Read tool, codex view_image,
# gemini-cli read_file). The LLM judge needs OPENAI_API_KEY (and optionally
# OPENAI_BASE_URL / CHARXIV_JUDGE_MODEL) exported in the host environment.
#
# agents:
#   - name: claude-code
#     model_name: anthropic/claude-haiku-4-5-20251001
#
# CLI-agent run reported in the README (500-task parity subset):
# agents:
#   - name: codex
#     model_name: openai/gpt-4o-mini-2024-07-18
#     kwargs:
#       version: "0.169.1"
#
# Optional: closer to upstream's no-tools, no-internet setting (see README,
# "Web lookup"). Allow only the model API host during the agent phase and turn
# off hosted web tools (Claude Code's WebSearch runs on Anthropic's side):
#     extra_allowed_hosts: ["api.anthropic.com"]   # needs [agent] network_mode
#     kwargs:                                      # = "no-network" in task.toml
#       disallowed_tools: "WebSearch,WebFetch"

environment:
  type: docker
  delete: true

orchestrator:
  type: local
  n_concurrent_trials: 4
