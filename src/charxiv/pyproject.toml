[project]
name = "harbor-charxiv-adapter"
version = "0.1.0"
description = "Harbor adapter for the CharXiv chart-understanding benchmark (validation split)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
charxiv = "charxiv.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charxiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
