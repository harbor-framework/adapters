[project]
name = "harbor-charxiv-adapter"
version = "0.1.0"
description = "Harbor adapter for the CharXiv chart-understanding benchmark (validation split)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only for the charxiv-direct parity agent (src/charxiv/parity_agent.py).
parity = [
    "harbor==0.23.0; python_version >= '3.12'",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.scripts]
charxiv = "charxiv.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charxiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
