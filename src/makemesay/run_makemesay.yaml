datasets:
  - path: datasets/makemesay

agents:
  - name: makemesay.agent:MakeMeSayAgent
    # Supply the manipulator model with -m. By default the manipulatee uses it too.
    # Set kwargs.manipulatee_model for a separate manipulatee model.
    # The verifier judge model is set through MAKEMESAY_JUDGE_MODEL.
    kwargs:
      request_timeout_sec: 120

environment:
  type: docker
  delete: true

orchestrator:
  type: local
  n_concurrent_trials: 1
