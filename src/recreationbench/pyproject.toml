[project]
name = "harbor-recreationbench-adapter"
version = "0.1.0"
description = "Harbor adapter for the Web split of RecreationBench"
readme = "README.md"
authors = [
    { email = "christian@alloy.app" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface_hub>=0.34",
]

[project.scripts]
recreationbench = "recreationbench.main:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recreationbench"
