jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 2
  quiet: false

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - name: claude-code
    model_name: anthropic/claude-haiku-5-5
    kwargs:
      version: "2.1.330"
    override_timeout_sec: 1800

# Alfworld parity subset: 10 episodes × 12 QAs = 120 QAs (EMBODIED_AI, ids 30-39).
datasets:
  - path: datasets/ama-bench
    task_names:
      - ama-bench-30
      - ama-bench-31
      - ama-bench-32
      - ama-bench-33
      - ama-bench-34
      - ama-bench-35
      - ama-bench-36
      - ama-bench-37
      - ama-bench-38
      - ama-bench-39
