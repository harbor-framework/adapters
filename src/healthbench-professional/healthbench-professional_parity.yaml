# Parity runs: claude-code with Claude Haiku 5.5 on the 150-task subset.
# From the repository root, after generating the subset (see the README):
#   harbor run -c src/healthbench-professional/healthbench-professional_parity.yaml
# The judge (gpt-5.4-2026-03-05, reasoning low) comes from task.toml and reads
# OPENAI_API_KEY / OPENAI_BASE_URL from the host environment.
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  force_build: true
  delete: true
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
agents:
  - name: claude-code
    model_name: anthropic/claude-haiku-5-5
    kwargs:
      version: "2.1.322"  # same Claude Code build as the simple-evals side
datasets:
  - path: datasets/healthbench-professional-parity
