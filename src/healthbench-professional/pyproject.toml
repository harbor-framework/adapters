[project]
name = "harbor-healthbench-professional-adapter"
version = "0.1.0"
description = "Harbor adapter for OpenAI HealthBench Professional"
readme = "README.md"
authors = [
    { name = "Mike-7777777", email = "41225783+Mike-7777777@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
healthbench-professional = "healthbench_professional.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "healthbench_professional"
