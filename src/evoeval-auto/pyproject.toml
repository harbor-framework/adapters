[project]
name = "harbor-evoeval-auto-adapter"
version = "0.1.0"
description = "Harbor adapter for EvoEval (Evolving Coding Benchmarks via LLM); default dataset EvoEval_difficult"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evoeval-auto = "evoeval_auto.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evoeval_auto"
