# Reference job config for the EvoEval adapter (full EvoEval_difficult dataset).
# Default agent: oracle. Run from the repository root:
#   uvx --python 3.12 --from "harbor[daytona,adapter]==0.23.0" harbor run \
#     -c src/evoeval-auto/run_evoeval-auto.yaml --env-file oracle.env -y
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 12
  quiet: false
environment:
  type: daytona   # the reported runs used Daytona
  delete: true
agents:
  - name: oracle
# Parity agent (original EvoEval harness as a Harbor agent; needs
# PYTHONPATH=src/evoeval-auto/src and OPENAI_API_KEY / OPENAI_BASE_URL), see
# run_evoeval-auto_parity.yaml.
#
# A standard CLI agent:
#  - name: terminus-2
#    model_name: openai/deepseek-v4.1-flash
datasets:
  - path: datasets/evoeval-auto
