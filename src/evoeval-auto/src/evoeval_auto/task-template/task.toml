version = "1.0"
# The agent's submission is copied from the agent sandbox into the separate verifier
# sandbox at the same path.
artifacts = ["/workspace/solution.py"]

[task]
name = "{task_name}"
description = "{dataset} problem {source_id}: complete the Python function `{entry_point}`."
authors = [
    { name = "Chunqiu Steven Xia", email = "chunqiu2@illinois.edu" },
    { name = "Yinlin Deng", email = "yinlind2@illinois.edu" },
    { name = "Lingming Zhang", email = "lingming@illinois.edu" },
]
keywords = ["evoeval", "{dataset_slug}", "python", "code-generation", "function-completion"]

[metadata]
difficulty = "{difficulty}"
category = "programming"
tags = ["evoeval", "{dataset_slug}", "python", "code-generation"]
source_benchmark = "EvoEval"
source_dataset = "{dataset}"
source_task_id = "{source_id}"
source_parent = "{parent}"
entry_point = "{entry_point}"

[agent]
timeout_sec = 1200.0
# Unprivileged user (created in environment/Dockerfile).
user = "agent"

[verifier]
timeout_sec = 900.0
# Grade in a fresh sandbox: the hidden tests never enter the agent's container.
environment_mode = "separate"

[verifier.environment]
# Prebuilt base image (no Docker build context); tests/ is uploaded to the workdir and
# test.sh installs the pinned evaluator dependencies.
docker_image = "python:3.9.19-slim-bookworm"
workdir = "/tests"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
