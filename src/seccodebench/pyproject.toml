[project]
name = "harbor-seccodebench-adapter"
version = "0.1.0"
description = "Harbor adapter for SecCodeBench (alibaba/sec-code-bench)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seccodebench = "seccodebench.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seccodebench"]
