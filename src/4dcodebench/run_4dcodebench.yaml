# Reference config for the generated 4DCodeBench dataset (both splits).
#
#     harbor run -c src/4dcodebench/run_4dcodebench.yaml
#
# The default oracle submits the reference world on synthetic cases and is UNRESOLVED
# on real ones (its solve.sh exits 1); run_4dcodebench_synthetic_oracle.yaml runs the
# synthetic oracle alone.
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0

datasets:
  - path: datasets/4dcodebench

# Aggregate each reward key over the trials that report it (metric.py); Harbor's
# default mean would count a metric that does not apply to a case as 0.
metrics:
  - type: uv-script
    kwargs:
      script_path: datasets/4dcodebench/metric.py

# Default: oracle agent for verification
agents:
  - name: oracle

# Uncomment to run with other agents (parity agents and models are still to be agreed):
# agents:
#   - name: claude-code
#     model_name: anthropic/claude-opus-5-5
#
# agents:
#   - name: codex
#     model_name: openai/gpt-5

environment:
  type: docker
  delete: true

orchestrator:
  type: local
  # every trial reserves GPUs for its agent container and then its verifier container
  n_concurrent_trials: 1
