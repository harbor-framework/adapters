datasets:
  - path: datasets/contextbench

# ContextBench's benchmark aggregates. A local dataset needs this block; a
# registered dataset carries metric.py and Harbor applies it.
metrics:
  - type: uv-script
    kwargs:
      script_path: datasets/contextbench/metric.py
