jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 4
quiet: false

environment:
  type: docker
  force_build: false
  delete: true

# The oracle checks the pipeline. To run an agent instead, comment out the
# oracle and uncomment one block. The Bedrock examples read temporary AWS
# credentials from the environment; no credential is stored here.
agents:
  - name: oracle
