[project]
name = "harbor-agentclinic-adapter"
version = "0.1.0"
description = "Harbor adapter for AgentClinic: interactive diagnosis with a simulated patient and measurement reader (MedQA extended)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
harbor = ["harbor==0.27.0"]

[dependency-groups]
dev = ["pytest>=8", "fastmcp==4.1.8", "httpx>=0.28", "harbor==0.27.0"]

[project.scripts]
agentclinic = "agentclinic.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentclinic"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to GitHub"]
