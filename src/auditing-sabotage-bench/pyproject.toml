[project]
name = "harbor-auditing-sabotage-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for Auditing Sabotage Bench: audit ML research codebases for sabotage"
readme = "README.md"
authors = [
    { name = "Bhagyesh Kumar", email = "invi.bhagyesh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
auditing-sabotage-bench = "auditing_sabotage_bench.main:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auditing_sabotage_bench"
