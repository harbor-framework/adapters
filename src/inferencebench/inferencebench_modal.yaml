# Oracle verification on Modal cloud GPUs. The oracle is judged like any other run, so the
# host needs HF_TOKEN and a judge credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN);
# without one, no trial is evaluated or graded. Each trial gets its own sandbox and GPU, so -n
# can be raised to your H100 quota once a single task has passed.
# From the repository root, one task at a time (see "Oracle pilot" in the README):
#   uv run --project src/inferencebench --with 'harbor[modal]==0.26.0' harbor run -c src/inferencebench/inferencebench_modal.yaml \
#       -p datasets/inferencebench -i inferencebench-a-mistral-7b-21-1337
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 1
quiet: false
environment:
  type: modal
  delete: true
agents:
  - name: oracle
datasets:
  - path: datasets/inferencebench
