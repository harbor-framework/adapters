# Oracle verification on Modal cloud GPUs.
# From the repository root:
#   uv run --project src/inferencebench --with 'harbor[modal]==0.25.0' harbor run -c src/inferencebench/inferencebench_modal.yaml
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 12
  quiet: false
environment:
  type: modal
  delete: true
agents:
  - name: oracle
datasets:
  - path: datasets/inferencebench
