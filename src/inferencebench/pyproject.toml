[project]
name = "harbor-inferencebench-adapter"
version = "0.1.0"
description = "Harbor adapter for InferenceBench, a benchmark of agents optimizing an LLM inference server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
inferencebench = "inferencebench.main:main"
inferencebench-score = "inferencebench.score:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inferencebench"
