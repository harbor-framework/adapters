[project]
name = "harbor-control-arena-rogue-eval-honest-adapter"
version = "0.1.0"
description = "ControlArena's honest two-digit addition assessment for Harbor"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["control-arena==20.1.1", "inspect-ai==0.3.292", "harbor==0.27.0", "filelock>=3.29.4"]

[project.scripts]
control-arena-rogue-eval-honest = "control_arena_rogue_eval_honest.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "control_arena_rogue_eval_honest"
