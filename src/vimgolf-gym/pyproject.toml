[project]
name = "harbor-vimgolf-gym-adapter"
version = "0.1.0"
description = "Harbor adapter for VimGolf-Gym (612 public vimgolf.com challenges)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "litellm==1.105.0",
]

[project.optional-dependencies]
# only needed to regenerate oracle_solutions.json (oracle/build_oracles.py)
oracle = ["vimgolf==0.5.1"]

[project.scripts]
vimgolf-gym = "vimgolf_gym.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vimgolf_gym"
