[project]
name = "harbor-axionlimitbench-adapter"
version = "0.1.0"
description = "Harbor adapter for AxionLimitBench"
readme = "README.md"
authors = [
    { name = "Jianghao Zhang", email = "jianghz@umich.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
axionlimitbench = "axionlimitbench.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "axionlimitbench"
