[project]
name = "harbor-gaia-adapter"
version = "0.1.0"
description = "Harbor adapter for gaia"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "huggingface_hub",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Flat layout: tests import adapter.py and run_adapter.py as top-level modules.
pythonpath = ["."]

# Flat-layout adapter (run_adapter.py at root); not an installable package —
# uv provisions the dependencies above and runs the script directly.
[tool.uv]
package = false
