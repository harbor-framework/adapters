# Parity run of the 300-task subset (generate it with `uv run or-bench --split parity`).
# Same agent and judge model as the original-side runner in the fork.
# Needs OPENAI_API_KEY (agent and judge); set OPENAI_BASE_URL if you use a relay.
#   export JUDGE_MODEL=gpt-5.6-terra
#   harbor run -c src/or-bench/run_or-bench_parity.yaml
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 7
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
  - name: codex
    model_name: openai/gpt-5.6-terra
    kwargs:
      version: "0.161.0"
      # config: /path/to/codex-config.toml   # relay settings, if any
datasets:
  - path: datasets/or-bench-parity
