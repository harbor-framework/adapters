schema_version = "1.0"

# The verifier starts in a fresh container. These agent outputs are copied into it
# at the same paths: the response file, and the agent logs that grade.py falls back
# to when the agent answers in chat instead of writing the file.
artifacts = ["/app/response.txt", "/logs/agent"]

[task]
name = "bench-llm/or-bench__{task_id}"
authors = [
    { name = "Justin Cui" },
    { name = "Wei-Lin Chiang" },
    { name = "Ion Stoica" },
    { name = "Cho-Jui Hsieh" },
]
keywords = ["safety", "over-refusal", "{subset}"]

[metadata]
difficulty = "easy"
category = "safety"
subset = "{subset}"
prompt_category = "{category}"
expected_behavior = "{expected_behavior}"
judge = "{judge}"

# The verifier runs in a separate, fresh container (environment_mode = "separate"),
# built from the same image as the agent's. tests/ (grader and ground_truth.json)
# is uploaded to it after the agent finishes.
{verifier}
[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
