[project]
name = "harbor-kernelbench-adapter"
version = "0.1.0"
description = "Harbor adapter for KernelBench and KernelBench-Verified (CUDA kernel optimization, GPU-graded)"
readme = "README.md"
authors = [
    { name = "haoqingwang", email = "1506751656@qq.com" }
]
requires-python = ">=3.12"
dependencies = ["tomli>=2.0"]

[project.scripts]
kernelbench = "kernelbench.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kernelbench"
