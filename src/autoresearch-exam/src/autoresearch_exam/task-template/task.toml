# ARE 1.1 settings, merged over each source task's own task.toml.
artifacts = [{ source = "/var/lib/are", service = "grader" }]

[task]
name = "bespokelabs/{task_id}"
version = "1.1.0"
description = ""
authors = [
    { name = "Anirudha Ramesh" },
    { name = "Siddartha Devic" },
    { name = "Shivank Garg" },
    { name = "Advait Parulekar" },
    { name = "Drish Mahnot" },
    { name = "Shreyas Pimpalgaonkar" },
    { name = "Vishnu Suresh" },
    { name = "Alex Dimakis" },
    { name = "Maheswaran Sathiamoorthy" },
]

[metadata]
are_version = "1.1"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

# Runs after the agent stops: waits until every submission has its val and test grade.
[[verifier.collect]]
service = "grader"
command = "/opt/are/venv/bin/python /opt/are/drain.py"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
gpus = 0

[environment]
# Setup (installing the agent) needs package registries. The agent's own run keeps
# the task's allowlist from [agent].
network_mode = "public"
mcp_servers = [{ name = "are", transport = "streamable-http", url = "http://grader:8000/mcp" }]
