[project]
name = "harbor-autoresearch-exam-adapter"
version = "0.1.0"
description = "Harbor adapter for AutoResearchExam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0"]

[project.scripts]
autoresearch-exam = "autoresearch_exam.main:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch_exam"]
