[project]
name = "harbor-brick-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for BrickBench (agentic text-conditioned LEGO design benchmark)"
readme = "README.md"
authors = [
    { name = "Harbor Contributors" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
brick-bench = "brick_bench.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brick_bench"
