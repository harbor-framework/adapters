datasets:
  - path: datasets/brick-bench

# Default: oracle agent for verification
agents:
  - name: oracle

# Uncomment to run with coding agents (matches upstream BrickAgent Codex setup):
# agents:
#   - name: codex
#     model_name: openai/gpt-5.4
#
# agents:
#   - name: claude-code
#     model_name: claude-sonnet-4-5-20250929

environment:
  type: docker
  delete: true
  # For multi-task runs, pre-download google/gemma-4-31B-it (rev 842da3794eaa0b77d5f08bae87a17459d91ff475)
  # onto the host and mount it read-only to avoid re-downloading ~62 GB per trial:
  # mounts:
  #   - type: bind
  #     source: /var/cache/brickbench-hf
  #     target: /opt/hf-cache
  #     read_only: true

orchestrator:
  type: local
  n_concurrent_trials: 1
