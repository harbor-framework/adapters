[project]
name = "harbor-prbench-adapter"
version = "0.1.0"
description = "Harbor adapter for Scale AI PRBench"
readme = "README.md"
authors = [
    { name = "Mike-7777777", email = "41225783+Mike-7777777@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=18.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
prbench = "prbench.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prbench"
