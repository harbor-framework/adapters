services:
  main:
    depends_on:
      agentdojo-runtime:
        condition: service_healthy

  agentdojo-runtime:
    build:
      context: ./runtime-server
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('localhost',8000),timeout=2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
