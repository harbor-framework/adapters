schema_version = "1.0"

[task]
name = "ethz-spylab/agentdojo__{task_name}"
authors = [
    { name = "Edoardo Debenedetti", email = "edoardo.debenedetti@inf.ethz.ch" },
    { name = "Jie Zhang", email = "jie.zhang@inf.ethz.ch" },
    { name = "Mislav Balunović", email = "mislav.balunovic@inf.ethz.ch" },
    { name = "Luca Beurer-Kellner", email = "luca.beurer-kellner@inf.ethz.ch" },
    { name = "Marc Fischer" },
    { name = "Florian Tramèr" },
]
keywords = ["agentdojo", "prompt-injection", "tool-use", "agent-security", "{suite}"]

[metadata]
difficulty = "{difficulty}"
category = "agent-security"
benchmark_version = "{benchmark_version}"
suite = "{suite}"
split = "{split}"
user_task_id = "{user_task_id}"
injection_task_id = "{injection_task_id}"
attack = "{attack}"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "agentdojo"
transport = "streamable-http"
url = "http://agentdojo-runtime:8000/mcp"
