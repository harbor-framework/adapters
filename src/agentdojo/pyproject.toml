[project]
name = "harbor-agentdojo-adapter"
version = "0.1.0"
description = "Harbor adapter for AgentDojo (prompt injection attacks and defenses for tool-using agents)"
readme = "README.md"
authors = [
    { name = "Jianing Yin", email = "jianingyin@alumni.upenn.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "agentdojo==0.1.35",
]

[project.scripts]
agentdojo = "agentdojo_adapter.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

# Package is `agentdojo_adapter`, not `agentdojo`, because the `agentdojo`
# dependency provides the top-level `agentdojo` module the adapter imports.
[tool.uv.build-backend]
module-name = "agentdojo_adapter"
