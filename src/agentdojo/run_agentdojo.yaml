jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  force_build: true
  delete: true
  # env:
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
# Tasks need an MCP-capable agent: the suite tools are served by the
# agentdojo-runtime sidecar over MCP. No judge or API key is needed to score.
agents:
  - name: oracle
  # - name: claude-code
  #   model_name: anthropic/claude-haiku-4-5-20251001
  # - name: codex
  #   model_name: openai/gpt-5-mini
datasets:
  - path: datasets/agentdojo
