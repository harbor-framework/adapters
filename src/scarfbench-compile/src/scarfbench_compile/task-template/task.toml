version = "1.0"

artifacts = [{ source = "/app", exclude = ["target", ".gradle", ".m2repo"] }]

[task]
name = "scarfbench-compile/__TASK_ID__"
description = "Migrate the __APP_NAME__ __FRAMEWORK_FROM_DISPLAY__ application to __FRAMEWORK_TO_DISPLAY__ (compile + deploy + health)"
authors = [
  { name = "Rahul Krishna" },
  { name = "Bridget McGinn", email = "bridget.mcginn@ibm.com" },
]
keywords = [__KEYWORDS__]

[verifier]
timeout_sec = 7200.0
# Grade in a dedicated container built from tests/Dockerfile (toolchain image +
# /tests baked in); /app is carried over via the artifacts entry above, so the
# agent cannot tamper with grading.
environment_mode = "separate"

[verifier.environment]
# No docker_image here: Harbor builds tests/Dockerfile, which layers /tests on
# top of the toolchain image (separate verifiers do not upload tests/).
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 20480

[agent]
timeout_sec = 9000.0
network_mode = "allowlist"
allowed_hosts = [
  "maven-central.storage-download.googleapis.com",
  "repo.maven.apache.org",
  "repo1.maven.org",
  "plugins.gradle.org",
  "services.gradle.org",
  "github.com",
  "objects.githubusercontent.com",
  "release-assets.githubusercontent.com",
  "registry.quarkus.io",
  "models.opencode.ai",
  "raw.githubusercontent.com",
]

[environment]
build_timeout_sec = 900.0
# Pre-built toolchain image — avoids rebuilding the ~1-2 GB image for every
# task run.  Set at adapter generation time via --docker-image / the
# SCARFBENCH_DOCKER_IMAGE env var.
# Example: ghcr.io/scarfbench/scarfbench-base:2026-10-09
docker_image = "__DOCKER_IMAGE__"
cpus = 2
memory_mb = 4096
storage_mb = 20480

[environment.metadata]
framework_from = "__FRAMEWORK_FROM_DISPLAY__"
framework_to = "__FRAMEWORK_TO_DISPLAY__"
