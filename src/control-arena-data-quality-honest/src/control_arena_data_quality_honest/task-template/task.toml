version = "1.0"

[task]
name = "control-arena/{slug}"
authors = [{name = "ControlArena contributors"}]

[metadata]
setting = "data_poisoning"
domain = "factual_accuracy_monitoring"
evaluation_mode = "honest"

[agent]
timeout_sec = 600

[environment]
cpus = 1
memory_mb = 512
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 2048
build_timeout_sec = 1200

[verifier.env]
CONTROL_ARENA_JUDGE_MODEL = "${CONTROL_ARENA_JUDGE_MODEL:-mockllm/data-quality-fixture}"
