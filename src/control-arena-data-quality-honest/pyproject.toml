[project]
name = "harbor-control-arena-data-quality-honest-adapter"
version = "0.1.0"
description = "Generate honest factual-accuracy monitor-data tasks from ControlArena"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["control-arena==20.1.1", "inspect-ai==0.3.292"]

[project.scripts]
control-arena-data-quality-honest = "control_arena_data_quality_honest.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "control_arena_data_quality_honest"
