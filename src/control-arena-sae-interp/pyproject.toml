[project]
name = "harbor-control-arena-sae-interp-adapter"
version = "0.1.0"
description = "Generate Harbor tasks for ControlArena's SAE feature interpretation setting"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "control-arena==20.1.1",
    "filelock>=3.29.4",
    "harbor==0.27.0",
    "inspect-ai==0.3.292",
]

[project.scripts]
control-arena-sae-interp = "control_arena_sae_interp.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "control_arena_sae_interp"
