    CONTROL_ARENA_EVAL_MODE: honest
    CONTROL_ARENA_JUDGE_MODEL: ${CONTROL_ARENA_JUDGE_MODEL:-openai/gpt-4.1-mini-2025-04-14}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
environment:
  type: docker
  delete: true
orchestrator:
  type: local
  n_concurrent_trials: 2
