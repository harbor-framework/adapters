[project]
name = "harbor-fm-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for FM-Bench (Solo track)"
readme = "README.md"
requires-python = ">=3.11"
# pyyaml: the FM-Bench engine reads params.yaml when the adapter asks it for
# the tool schemas. Harbor is not listed: parity_agent.py is imported by
# `harbor run`, which provides it.
dependencies = ["pyyaml>=6.0"]

[project.scripts]
fm-bench = "fm_bench.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_bench"]
