jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false
environment:
  type: docker
  # type: daytona
  force_build: false
  delete: true
  # env:
  #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #   ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
  #   OPENAI_API_KEY: ${OPENAI_API_KEY}
  #   OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
# Default: oracle (ground-truth factory scripts).
agents:
  - name: oracle
# Uncomment to run a coding agent instead (the upstream coding-agent harness
# benchmarks Claude Code, Codex CLI and Gemini CLI):
# agents:
#   - name: claude-code
#     model_name: anthropic/claude-sonnet-4-5-20250929
# agents:
#   - name: codex
#     model_name: openai/gpt-5.4
datasets:
  - path: datasets/threedcodebench
