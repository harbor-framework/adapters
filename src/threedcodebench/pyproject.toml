[project]
name = "harbor-threedcodebench-adapter"
version = "0.1.0"
description = "Harbor adapter for 3DCodeBench: procedural 3D modeling via Blender 5.0 Python code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=0.34",
]

[project.scripts]
threedcodebench = "threedcodebench.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "threedcodebench"
