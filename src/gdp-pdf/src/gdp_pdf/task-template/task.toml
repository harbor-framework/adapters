schema_version = "1.0"

[task]
name = "gdp-pdf/{task_name}"
authors = [
    { name = "Surge AI", email = "benchmarks@surgehq.ai" },
]
keywords = ["gdp-pdf", "{domain}", "pdf", "document-understanding", "llm-judge"]

[metadata]
difficulty = "hard"
category = "document-reasoning"

[verifier]
# One judge call per rubric point, up to 30 points, each retried up to 5 times.
timeout_sec = 900.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-gemini-3.5-flash}"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 10240
