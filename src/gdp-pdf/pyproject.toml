[project]
name = "harbor-gdp-pdf-adapter"
version = "0.1.0"
description = "Harbor adapter for GDP.pdf: expert questions over professional PDFs, graded per rubric point by an LLM judge"
readme = "README.md"
authors = [
    { name = "Pranav Vashistha", email = "220042524+Pranavv-dev@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.34",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "openai==1.109.1",
    "pytest>=8",
]

[project.scripts]
gdp-pdf = "gdp_pdf.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gdp_pdf"
