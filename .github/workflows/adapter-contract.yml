name: Adapter Contract

on:
  pull_request:
    paths:
      - 'docs/adapters*.mdx'
      - 'skills/create-adapter/**'
      - 'skills/upload-parity-experiments/**'
      - 'scripts/validate_adapter.py'
      - 'scripts/tests/**'
      - '.github/workflows/adapter-review.yml'
      - '.github/workflows/adapter-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/adapters*.mdx'
      - 'skills/create-adapter/**'
      - 'skills/upload-parity-experiments/**'
      - 'scripts/validate_adapter.py'
      - 'scripts/tests/**'
      - '.github/workflows/adapter-review.yml'
      - '.github/workflows/adapter-contract.yml'

permissions:
  contents: read

jobs:
  contract-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
