name: Adapter Review Runtime Diagnostic

on:
  pull_request:
    paths: [.github/workflows/adapter-review-runtime-diagnostic.yml]

permissions:
  contents: read

jobs:
  documented-host:
    if: github.head_ref == 'diagnose/adapter-review-runtime-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare model inventories on configured and documented PPAPI hosts
        shell: python
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          configured = os.environ["ANTHROPIC_BASE_URL"].rstrip("/")
          key = os.environ["ANTHROPIC_API_KEY"]
          documented = "https://app.ppapi.ai"
          print(json.dumps({"configured_matches_documented_host": configured == documented}))
          for label, base in [("configured", configured), ("official-docs", documented)]:
              request = urllib.request.Request(base + "/v1/models", headers={"Authorization": "Bearer " + key})
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.load(response)
                      models = payload.get("data", [])
                      names = sorted(m.get("id", "") for m in models if "claude" in m.get("id", "").lower())
                      output = json.dumps({"probe": label, "status": response.status,
                                           "total_models": len(models), "claude_models": names,
                                           "message": payload.get("message")})
              except urllib.error.HTTPError as error:
                  raw = error.read().decode(errors="replace")
                  output = json.dumps({"probe": label, "status": error.code,
                                       "error": raw[:2500] if raw.lstrip().startswith("{") else "Non-JSON response"})
              except Exception as error:
                  output = json.dumps({"probe": label, "error_type": type(error).__name__, "error": str(error)})
              for value in (key, configured):
                  if value:
                      output = output.replace(value, "[REDACTED]")
              print(output)

          body = {"model": "claude-opus-5-5", "max_tokens": 16,
                  "messages": [{"role": "user", "content": "Reply OK."}]}
          request = urllib.request.Request(documented + "/v1/messages",
              data=json.dumps(body).encode(), headers={"x-api-key": key,
              "anthropic-version": "2023-06-01", "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  payload = json.load(response)
                  result = {"probe": "official-docs-inference", "status": response.status,
                            "model": payload.get("model"), "type": payload.get("type"),
                            "stop_reason": payload.get("stop_reason"), "usage": payload.get("usage"),
                            "text": [b.get("text") for b in payload.get("content", []) if b.get("type") == "text"]}
          except urllib.error.HTTPError as error:
              result = {"probe": "official-docs-inference", "status": error.code,
                        "error": error.read().decode(errors="replace")[:4000]}
          except Exception as error:
              result = {"probe": "official-docs-inference", "error_type": type(error).__name__, "error": str(error)}
          output = json.dumps(result)
          for value in (key, configured):
              if value:
                  output = output.replace(value, "[REDACTED]")
          print(output)
